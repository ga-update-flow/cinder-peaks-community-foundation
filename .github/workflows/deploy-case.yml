# Deploy cases: publish any branch's version of the website to the live URL
#   https://hufsa-stack.github.io/cinder-peaks-community-foundation/
#
# How to use: Actions tab -> "Deploy cases" -> Run workflow -> choose a branch -> Run workflow.
# For a branch that is not in the list (for example, one created later), choose
# "Other branch (type its name below)" and type the exact branch name.
#
# What it does: creates a new commit on the gh-pages branch whose files are an exact copy
# of the chosen branch's website (its site/ folder, or the branch itself if it already
# holds a built site), then pushes it as a normal fast-forward. Nothing from the previously
# deployed version is kept, no branch is merged or edited, and GitHub Pages settings and
# the URL are unchanged.
name: Deploy cases

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Branch to publish on the live website"
        type: choice
        required: true
        options:
          - v1-original
          - 01 spring-eligibility-three-years
          - 02 fall-cycle-email-application
          - 03 rapid-response-focus-areas-update
          - 04 first-steps-population-update
          - 05 stronger-nonprofits-funding-increase
          - 06 rapid-response-funding-decrease
          - 07 spring-cycle-opening-date-february-15
          - 08 shared-catalog-registration-deadline
          - 09 plateau-fund-loi-deadline-december-18
          - 10 fall-cycle-deadline-august-27
          - 11 fall-cycle-board-meeting-date
          - 12 first-steps-award-notification-date
          - 13 prism-guidelines-document-replacement
          - 14 shared-catalog-template-replacement
          - 15 plateau-fund-contact-update
          - 16 prism-fund-early-closure
          - 17 rising-roots-soft-404-test
          - clean-preview-eligibility-policies
          - clean-preview-spring-fall-eligibility
          - clean-preview-deadline-600-pm
          - clean-preview-history-arts-culture
          - main
          - gh-pages-v1-original
          - Other branch (type its name below)
      other_branch:
        description: "Only if you chose 'Other branch': the exact branch name"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: deploy-case
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the chosen branch to gh-pages
        env:
          CASE: ${{ inputs.case }}
          OTHER: ${{ inputs.other_branch }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://hufsa-stack.github.io/cinder-peaks-community-foundation/
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; { echo "### Not deployed"; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          if [ "$CASE" = "Other branch (type its name below)" ]; then
            BRANCH="$(echo "$OTHER" | xargs)"
            [ -n "$BRANCH" ] || fail "You chose 'Other branch' but left the branch name empty."
          else
            BRANCH="${CASE##* }"   # drop the "01 " case number, keep the branch name
          fi
          git check-ref-format --branch "$BRANCH" >/dev/null 2>&1 || fail "'$BRANCH' is not a valid branch name."
          [ "$BRANCH" != "gh-pages" ] || fail "gh-pages is the live website itself. Choose the branch you want to publish."
          echo "Selected: $CASE  ->  branch: $BRANCH"

          git init -q work && cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "+refs/heads/gh-pages:refs/remotes/origin/gh-pages"
          git fetch -q --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null \
            || fail "Branch '$BRANCH' was not found in the repository. Check the spelling on the Branches page."

          SRC=$(git rev-parse "origin/${BRANCH}")
          if git rev-parse -q --verify "origin/${BRANCH}:site/index.html" >/dev/null; then
            TREE=$(git rev-parse "origin/${BRANCH}:site")             # source branch: built site in site/
          elif git rev-parse -q --verify "origin/${BRANCH}:index.html" >/dev/null; then
            TREE=$(git rev-parse "origin/${BRANCH}^{tree}")           # branch that already holds a built site
          else
            fail "Branch '$BRANCH' has no website files (no site/index.html or index.html)."
          fi
          PREV=$(git rev-parse origin/gh-pages)

          if [ "$(git rev-parse "${PREV}^{tree}")" = "$TREE" ]; then
            echo "This version is already live. Nothing to change."
            { echo "### ${BRANCH} is already live"; echo "Live website: ${SITE_URL}"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NEW=$(git commit-tree "$TREE" -p "$PREV" -m "Deploy ${BRANCH} (${SRC:0:7})")
          [ "$(git rev-parse "${NEW}^{tree}")" = "$TREE" ]          # exact copy of the branch's website
          git merge-base --is-ancestor "$PREV" "$NEW"                 # normal fast-forward, no force
          git push -q origin "${NEW}:refs/heads/gh-pages"

          echo "Published ${BRANCH} (${SRC:0:7}) as gh-pages ${NEW:0:7} (previous ${PREV:0:7})"
          {
            echo "### Published ${BRANCH}"
            echo "- Branch commit: \`${SRC:0:7}\`"
            echo "- gh-pages: \`${PREV:0:7}\` → \`${NEW:0:7}\`"
            echo "- Live website: ${SITE_URL}"
            echo ""
            echo "GitHub Pages updates the site in about 1–2 minutes (watch the \"pages build and deployment\" run)."
            echo "Reload pages with Ctrl+Shift+R (Cmd+Shift+R on Mac) if you still see the previous version."
          } >> "$GITHUB_STEP_SUMMARY"
